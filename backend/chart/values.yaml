image:
  repository: ghcr.io/tomassirio/pppp-backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

application:
  # Comma-separated emails seeded as admins while the allowlist is empty.
  admins: ""
  google:
    clientId: ""
    clientSecret: ""

# NAS-backed PVC created by turing-pi-server's storage chart.
# ROMs, battery saves and save states live under data/, Redis AOF under redis/.
persistence:
  existingClaim: pppp-data-pvc

redis:
  image: redis:7-alpine
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
