services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis:/data]
  backend:
    build: ./backend
    environment:
      REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PPPP_ADMINS: ${PPPP_ADMINS}
    ports: ["8080:8080"]
    volumes: [data:/data]
    depends_on: [redis]
volumes:
  redis:
  data:
