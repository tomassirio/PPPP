apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  labels:
    app: {{ .Chart.Name }}
data:
  default.conf: |
    # Keep the scheme set by the TLS-terminating ingress so OAuth redirect URIs stay https.
    map $http_x_forwarded_proto $fwd_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # k3s cluster DNS; resolving per request means nginx starts even before the backend Service exists.
    resolver 10.43.0.10 valid=10s ipv6=off;

    server {
        listen 80;
        root /usr/share/nginx/html;
        client_max_body_size 9m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (/api/v1/events) and WebSockets must not be buffered or cut short.
        location ~ ^/(api|ws|oauth2|login/oauth2)/ {
            set $backend {{ .Values.backend.service }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }};
            proxy_pass http://$backend;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /_app/immutable/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: a refresh on /play still loads the app.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
